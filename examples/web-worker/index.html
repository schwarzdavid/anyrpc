<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Anyrpc Web Worker Example</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="p-3">
            <h1 class="mb-4">Web Worker</h1>

            <p>
                The host pings the worker every 500&nbsp;ms. Blocking the worker longer than the heartbeat timeout
                reports it as disconnected until it answers again. Terminating it is detected the same way.
            </p>

            <h2>Controls</h2>

            <div class="d-flex my-3 gap-3">
                <button type="button" class="btn btn-primary" id="send-fibonacci">Compute fibonacci(40)</button>
                <button type="button" class="btn btn-warning" id="send-block">Block worker for 3&nbsp;s</button>
                <button type="button" class="btn btn-danger" id="terminate">Terminate worker</button>
            </div>

            <h2>Output</h2>

            <div class="form-control">
                <ul class="mb-0" id="output"></ul>
            </div>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
