<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>anyrpc WebSocket example</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="p-3">
            <h1 class="mb-4">WebSocket</h1>

            <p>
                Start the server with <code>node examples/websocket/server.ts</code> and open this page in several tabs.
                Every message is broadcast to all tabs. Restarting the server shows the client disconnecting and
                reconnecting.
            </p>

            <h2>Chat</h2>

            <form class="d-flex my-3 gap-3" id="chat">
                <input class="form-control" name="text" type="text" placeholder="Message" autocomplete="off" />
                <button type="submit" class="btn btn-primary">Send</button>
            </form>

            <h2>Output</h2>

            <div class="form-control">
                <ul class="mb-0" id="output"></ul>
            </div>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
