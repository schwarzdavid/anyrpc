<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Anyrpc Shared Worker Example</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="p-3">
            <h1 class="mb-4">Shared Worker: <span id="title"></span></h1>

            <p>
                Open this page in several tabs. Every tab is a peer of one shared worker, which keeps a shared counter
                and broadcasts every change. Closing a tab removes it from the worker after a missed heartbeat.
            </p>

            <p>Connected tabs: <strong id="peers">0</strong> &middot; Counter: <strong id="counter">0</strong></p>

            <h2>Controls</h2>

            <div class="d-flex my-3 gap-3">
                <button type="button" class="btn btn-primary" id="increment">Increment shared counter</button>
                <button type="button" class="btn btn-secondary" id="collect-titles">Ask every tab for its title</button>
            </div>

            <h2>Output</h2>

            <div class="form-control">
                <ul class="mb-0" id="output"></ul>
            </div>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
