name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Check release tag matches package version
              run: |
                  PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
                      exit 1
                  fi

            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run format
            - run: npm run lint
            - run: npm run check
            - run: npm run coverage

    publish:
        needs: verify
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - run: npm ci
            - run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
